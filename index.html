<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karty katalogowe</title>
<style>
  :root { --bg:#fafaf7; --fg:#1d1d1b; --muted:#6b6b66; --line:#ddd9cf; --card:#fff; --acc:#8a3b12; }
  @media (prefers-color-scheme: dark) { :root { --bg:#171715; --fg:#ecebe6; --muted:#9c9b94; --line:#34332e; --card:#201f1c; --acc:#e59a6b; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; padding:16px; box-sizing:border-box }
  main { max-width:640px; text-align:center }
  h1 { font-size:26px; margin:0 0 8px }
  p { color:var(--muted); margin:0 0 32px }
  nav { display:flex; gap:16px; justify-content:center; flex-wrap:wrap }
  nav a { flex:1 1 220px; display:block; padding:24px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); text-decoration:none }
  nav a:hover { border-color:var(--acc) }
  nav b { display:block; font-size:20px; color:var(--acc) }
  nav span { color:var(--muted); font-size:14px }
  .extra { margin-top:24px; font-size:14px } .extra a { color:var(--acc) }
</style>
</head>
<body>
<main>
  <h1>Karty katalogowe → baza danych</h1>
  <p>Skany kart katalogowych i rekordy wyekstrahowane z nich otwartymi modelami (NuExtract3).</p>
  <nav>
    <a href="karty.html?z=polona"><b>Polona</b><span id="n-polona">karty z Centralnego Katalogu BN</span></a>
    <a href="karty.html?z=ibpp"><b>IBPP</b><span id="n-ibpp">karty IBPP</span></a>
  </nav>
  <div class="extra"><a href="pokaz.html">Od karty do rekordu – przykład krok po kroku →</a></div>
</main>
<script>
fetch('cards.json').then(r => r.json()).then(d => ['polona', 'ibpp'].forEach(z => {
  const n = d.filter(c => c.source === z).length;
  document.getElementById('n-' + z).textContent += ` · ${n} ${n === 1 ? 'karta' : 'kart'}`;
}));
</script>
</body>
</html>

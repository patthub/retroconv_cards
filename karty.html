<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karty katalogowe</title>
<link rel="stylesheet" href="style.css?v=1">
<style>
  .card-img { aspect-ratio: 3 / 2; padding: 5%; }
  .record-img { display: block; max-width: 100%; max-height: 76vh; margin: 0 auto; border: 1px solid var(--line); background: var(--paper); }
</style>
</head>
<body>
<header class="site-header"><div class="wrap">
  <a href="./" class="wordmark">Karty katalogowe<br>→ baza danych</a>
  <nav class="site-nav"><a href="./">Kolekcje</a><a href="karty.html?z=polona" id="nav-polona">Polona</a><a href="karty.html?z=ibpp" id="nav-ibpp">IBPP</a></nav>
</div></header>
<div id="app"></div>
<footer class="site-footer">
  <div class="wrap footer-top">
    <div><strong>Karty katalogowe → baza danych</strong>Uniwersytet Warszawski</div>
    <ul><li><a href="./">Kolekcje</a></li><li><a href="cards.json">Pobierz dane (JSON)</a></li></ul>
    <p>Wersja pilotażowa. Rekordy wygenerowane automatycznie, bez weryfikacji przez bibliotekarza.</p>
  </div>
</footer>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P = new URLSearchParams(location.search), Z = P.get('z') || 'polona';
const NAME = { polona: 'Centralny Katalog BN (Polona)', ibpp: 'Instytut Biblioteka Polska w Paryżu' };
const FIELDS = { card_type: 'Typ karty', heading: 'Hasło', heading_type: 'Typ hasła', second_heading: 'Hasło dodatkowe',
  see_reference: 'Odsyłacz', title: 'Tytuł', edition: 'Wydanie / odpowiedzialność', place: 'Miejsce', printers_publishers: 'Drukarz / wydawca',
  date: 'Data', format: 'Format', extent: 'Objętość', gathering_signatures: 'Sygnatury składek', frequency: 'Częstotliwość',
  volumes: 'Tomy', copies: 'Egzemplarze', references: 'Bibliografie', notes: 'Uwagi', script: 'Pismo' };
const VALUES = { main_entry: 'karta główna', cross_reference: 'odsyłacz', continuation: 'kontynuacja', other: 'inna',
  handwritten: 'rękopiśmienne', typewritten: 'maszynowe', mixed: 'mieszane', printed: 'drukowane',
  person: 'osoba', title_word: 'słowo tytułu', corporate: 'instytucja', place: 'miejsce', subject: 'temat' };
const FACETS = ['script', 'card_type'];
const v = x => VALUES[x] || x;
const kart = n => `${n} ${n === 1 ? 'karta' : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? 'karty' : 'kart'}`;
const fmt = x => x == null || (Array.isArray(x) && !x.length) ? '' :
  Array.isArray(x) ? x.map(fmt).join('<br>') :
  typeof x === 'object' ? Object.entries(x).filter(([, y]) => y != null).map(([k, y]) => `<span class="label">${esc(k)}</span> ${esc(y)}`).join(' · ') : esc(v(x));
const link = ch => { const q = new URLSearchParams(P); for (const [k, x] of Object.entries(ch)) x == null ? q.delete(k) : q.set(k, x); return '?' + esc(q); };
document.getElementById('nav-' + Z)?.setAttribute('aria-current', 'page');

function record(c) {
  const L = c.label, rows = Object.entries(FIELDS).map(([k, n]) => fmt(L[k]) && `<div><dt>${n}</dt><dd>${fmt(L[k])}</dd></div>`).join('');
  return `
  <div class="record-top"><div class="wrap"><nav class="crumbs"><a href="./">Kolekcje</a> / <a href="${link({ id: null })}">${esc(NAME[Z])}</a></nav></div></div>
  <section class="wrap record-head">
    <p class="label">${esc(v(L.card_type))}</p>
    <h1>${esc(L.heading || L.title || '—')}</h1>
    ${L.heading && L.title ? `<p class="byline">${esc(L.title)}</p>` : ''}
    <div class="meta-row">${[L.place, L.date, v(L.script)].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('')}<span class="hot">${c.source === 'ibpp' ? 'wynik modelu' : 'etykieta'}</span></div>
  </section>
  <section class="viewer-band"><div class="wrap">
    <img class="record-img" src="images/${encodeURI(c.file)}" alt="Skan karty ${esc(c.file)}">
    <div class="viewer-bar"><span class="label">${esc(c.drawer)}</span>${c.polona ? `<a class="btn-line" href="${esc(c.polona)}" target="_blank" rel="noopener">Oryginał w Polonie ↗</a>` : ''}</div>
  </div></section>
  <section class="wrap record-body">
    <div class="record-main"><div class="block"><h2 class="label">Rekord</h2><dl class="details">${rows}</dl></div></div>
    <aside class="record-side">
      ${c.comment ? `<div class="block"><h2 class="label">Uwagi do odczytu</h2><p class="cite">${esc(c.comment)}</p></div>` : ''}
      <div class="block"><h2 class="label">Plik</h2><p class="sig">${esc(c.file)}</p></div>
    </aside>
  </section>`;
}

function list(all) {
  const q = (P.get('q') || '').toLowerCase();
  const hits = all.filter(c => FACETS.every(f => !P.get(f) || c.label[f] === P.get(f)) && (!q || JSON.stringify(c.label).toLowerCase().includes(q)));
  const facet = f => {
    const n = {}; all.forEach(c => n[c.label[f]] = (n[c.label[f]] || 0) + 1);
    return `<details class="facet" open><summary>${FIELDS[f]}</summary><ul>${Object.entries(n).sort((a, b) => b[1] - a[1]).map(([x, k]) =>
      `<li><a href="${link({ [f]: P.get(f) === x ? null : x })}"${P.get(f) === x ? ' aria-current="true"' : ''}>${esc(v(x))}<span class="n">${k}</span></a></li>`).join('')}</ul></details>`;
  };
  return `
  <section class="hero"><div class="wrap">
    <p class="label">Kolekcja</p>
    <h1>${esc(NAME[Z])}<span>.</span></h1>
    <div class="hero-meta"><p>Liczba kart: ${all.length}. Każda karta ze skanem i rekordem wyekstrahowanym przez model.</p></div>
    <form role="search" class="search"><input type="hidden" name="z" value="${esc(Z)}">
      ${FACETS.filter(f => P.get(f)).map(f => `<input type="hidden" name="${f}" value="${esc(P.get(f))}">`).join('')}
      <input type="search" name="q" value="${esc(P.get('q'))}" placeholder="Szukaj: hasło, tytuł, miejsce, drukarz, sygnatura" aria-label="Szukaj w kartach">
      <button class="btn">Szukaj</button></form>
  </div></section>
  <main class="wrap results-layout">
    <aside class="facets" aria-label="Filtry"><h2 class="label">Zawęź wyniki</h2>${FACETS.map(facet).join('')}</aside>
    <section class="results">
      <div class="results-head"><h1>${kart(hits.length)}</h1></div>
      <ul class="grid">${hits.map(c => `<li class="card"><a href="${link({ id: c.file })}">
        <div class="card-img"><img src="images/${encodeURI(c.file)}" alt="" loading="lazy"><span class="badge">${esc(v(c.label.script))}</span></div>
        <h3>${esc(c.label.heading || '—')}</h3><p class="meta">${esc((c.label.title || '').slice(0, 90))}</p>
        <p class="sig">${esc([c.label.place, c.label.date].filter(Boolean).join(', '))}</p></a></li>`).join('') || '<li class="empty">Brak wyników.</li>'}</ul>
    </section>
  </main>`;
}

fetch('cards.json').then(r => r.json()).then(d => {
  const all = d.filter(c => c.source === Z), c = all.find(c => c.file === P.get('id'));
  document.title = `${c ? (c.label.heading || c.file) + ' – ' : ''}${NAME[Z]} – karty katalogowe`;
  document.getElementById('app').innerHTML = c ? record(c) : list(all);
});
</script>
</body>
</html>
